name: 시험일 자동 갱신
on:
  schedule:
    - cron: "17 0 * * 1"   # 매주 월요일 09:17 (한국시간)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 공단 API 조회
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SERIES_CD: ${{ vars.SERIES_CD }}
        run: python update.py
      - name: 바뀌었으면 저장
        run: |
          if ! git diff --quiet exam-dates.json; then
            git config user.name "exam-date-bot"
            git config user.email "actions@users.noreply.github.com"
            git add exam-dates.json
            git commit -m "시험일 자동 갱신"
            git push
          else
            echo "변경 없음"
          fi
